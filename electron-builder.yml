appId: com.aisha.desktop
productName: Aisha
copyright: Copyright © 2026 Aisha

directories:
  output: release
  buildResources: build

asar: true
asarUnpack:
  - "dist/**/*"
  - "assets/**/*"

files:
  - electron/**/*
  - dist/**/*
  - assets/**/*
  - package.json

# The PyInstaller-frozen desktop agent (embeds its own Python runtime) is copied
# verbatim into resources/agent, so the target machine needs no Python.
extraResources:
  - from: agent_dist/aisha-agent
    to: agentaisha
    filter: ["**/*"]
  - from: assets
    to: assets
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aisha
  artifactName: Aisha-Setup.${ext}

portable:
  artifactName: Aisha.${ext}
